name: MINR checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  miner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile miner
        run: python -m py_compile miner.py
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
